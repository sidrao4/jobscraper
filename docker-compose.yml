services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: jobs
      POSTGRES_USER: jobs
      POSTGRES_PASSWORD: jobs
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobs -d jobs"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/jobs
      DB_USER: jobs
      DB_PASSWORD: jobs
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      EMBED_MAX_PER_RUN: ${EMBED_MAX_PER_RUN:-0}
    ports:
      - "8080:8080"

volumes:
  pgdata:
